<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111116">
<title>ALLSTAR Mobile</title>
<script src="js/mobile-install.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08080d;color:#fff;font-family:Arial,sans-serif}
#stage{position:fixed;top:0;left:env(safe-area-inset-left);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);overflow:hidden}
iframe{position:absolute;width:1360px;height:768px;border:0;transform-origin:0 0}
#rotate{display:none;position:fixed;inset:0;background:#111116;z-index:10;align-items:center;justify-content:center;text-align:center;padding:32px;line-height:1.7}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="stage"><iframe id="gameFrame" src="index.html?mobile=1" title="ALLSTAR" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
<div id="rotate"><div><strong>Tournez votre téléphone en paysage</strong><br>Cette première version se joue à l'horizontale.</div></div>
<script>
const frame=document.getElementById('gameFrame'),stage=document.getElementById('stage');
function fit(){const width=Math.max(1360,Math.round(768*stage.clientWidth/Math.max(1,stage.clientHeight)));frame.style.width=`${width}px`;const scale=Math.min(stage.clientWidth/width,stage.clientHeight/768);frame.style.transform=`scale(${scale})`;frame.style.left=`${(stage.clientWidth-width*scale)/2}px`;frame.style.top=`${(stage.clientHeight-768*scale)/2}px`}
addEventListener('resize',fit);visualViewport?.addEventListener('resize',fit);fit();
async function requestAllstarLandscape(){
 let locked=false;
 try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch{}
 try{if(screen.orientation?.lock){await screen.orientation.lock('landscape');locked=true}}catch{}
 fit();return {locked};
}
// Browsers require a real user gesture; installed PWAs already use fullscreen.
document.addEventListener('pointerup',()=>requestAllstarLandscape(),{once:true});
</script>
</body></html>
