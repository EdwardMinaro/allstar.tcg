name: Publish Windows Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restrict production publishing to main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish releases from main.' }

      - name: Read the release version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^0\.\d+\.\d+$') {
            throw "Invalid beta version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Validate the version tag before building
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          if (git tag --list $tag) {
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Version $tag is already used by another commit. Increase the version in package.json and package-lock.json."
            }
          }
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(p.version!==l.version||p.version!==l.packages[''].version)throw Error('Package versions do not match')"

      - name: Install dependencies
        run: npm ci

      - name: Verify the release candidate
        run: npm run verify

      - name: Verify account saves
        run: npm run test:accounts

      - name: Build the Windows release
        run: npm run dist -- --publish never

      - name: Verify the release files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $files = @(
            "dist/ALLSTAR-Setup-$version.exe",
            "dist/ALLSTAR-Setup-$version.exe.blockmap",
            "dist/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing release file: $file"
            }
          }
          $installer = "dist/ALLSTAR-Setup-$version.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          "$hash  ALLSTAR-Setup-$version.exe" | Set-Content -LiteralPath "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Set up Python for the mobile build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare mobile build tools
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $ffmpeg = (Get-Command ffmpeg -ErrorAction Stop).Source
          "ALLSTAR_FFMPEG=$ffmpeg" >> $env:GITHUB_ENV

      - name: Build mobile from the same release source
        run: python tools/prepare_mobile_web.py "${{ github.workspace }}/web-dist"

      - name: Verify mobile release provenance
        run: node -e "const a=require('./package.json'),b=require('./web-dist/release.json');if(a.version!==b.version||b.commit!==process.env.GITHUB_SHA)throw Error('Mobile build differs from release source')"

      - name: Authenticate GitHub to Firebase without a stored private key
        uses: google-github-actions/auth@v3
        with:
          project_id: allstar-65102
          workload_identity_provider: projects/516002177429/locations/global/workloadIdentityPools/allstar-releases/providers/github
          service_account: allstar-mobile-release@allstar-65102.iam.gserviceaccount.com

      - name: Install Firebase publishing tools
        run: npm install --prefix .firebase-cli --no-audit --no-fund firebase-tools@15.34.2

      - name: Create the version tag
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $existingTag = git tag --list $tag
          if ($existingTag) {
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Tag $tag already points to another commit."
            }
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "ALLSTAR ${{ steps.version.outputs.version }}"
            git push origin $tag
          }

      - name: Publish mobile to its permanent address
        run: node .firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js deploy --config firebase.mobile.json --project allstar-65102 --only hosting --non-interactive

      - name: Publish the open beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ALLSTAR ${{ steps.version.outputs.version }} - Beta ouverte
          body_path: docs/open-beta-release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/ALLSTAR-Setup-${{ steps.version.outputs.version }}.exe
            dist/ALLSTAR-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
